# HTTP guard for PRs targeting the phase4 integration branch.
# Requires a reachable Drupal site. Missing parity tooling or an unreachable
# site fails the job (it does not pass silently).
name: Parity smoke 200

on:
  pull_request:
    branches:
      - cursor/phase4-chrome-behavior-0b67

jobs:
  smoke-200:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dfimpact
          MYSQL_USER: dfimpact
          MYSQL_PASSWORD: dfimpact
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DF_DB_HOST: 127.0.0.1
      DF_DB_NAME: dfimpact
      DF_DB_USER: dfimpact
      DF_DB_PASS: dfimpact
      DRUPAL_BASE_URL: http://127.0.0.1:8888
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, gd
          coverage: none

      - name: Require parity tooling
        run: |
          if [ ! -f parity/package-lock.json ]; then
            echo "::error::parity/ is not in this tree. Restore it from tag archive/pre-acsf-handoff-47352229."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: parity/package-lock.json

      - name: Install parity dependencies
        working-directory: parity
        run: npm ci

      - name: Install Drupal and rebuild caches
        run: bash scripts/ci/search-api-index-gate.sh

      - name: Run smoke-200 guard
        working-directory: parity
        env:
          SMOKE_DRUPAL_REQUIRED: '1'
        run: npm run parity:smoke:200
