id: df_media_images
label: 'Import Dana-Farber Impact media images'
migration_group: df_migrate
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls:
    - modules/custom/df_migrate/data/media.json
  item_selector: ''
  fields:
    - name: wp_id
      label: 'WP Media ID'
      selector: wp_id
    - name: source_url
      label: 'Source URL'
      selector: source_url
    - name: wp_upload_path
      label: 'WP uploads relative path'
      selector: wp_upload_path
    - name: title
      label: Title
      selector: title
    - name: alt_text
      label: 'Alt text'
      selector: alt_text
    - name: filename
      label: Filename
      selector: filename
    - name: mime_type
      label: 'MIME type'
      selector: mime_type
  ids:
    wp_id:
      type: integer

process:
  uri:
    plugin: df_wp_upload_file
    source: source_url
  filemime: mime_type
  filename: filename
  status:
    plugin: default_value
    default_value: 1
  uid:
    plugin: default_value
    default_value: 1

destination:
  plugin: 'entity:file'
