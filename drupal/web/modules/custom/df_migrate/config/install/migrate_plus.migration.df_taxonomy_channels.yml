id: df_taxonomy_channels
label: 'Import Dana-Farber Impact Channels taxonomy'
migration_group: df_migrate
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls:
    - modules/custom/df_migrate/data/channels.json
  item_selector: ''
  fields:
    - name: name
      label: 'Term name'
      selector: name
    - name: slug
      label: Slug
      selector: slug
  ids:
    slug:
      type: string

process:
  name: name
  vid:
    plugin: default_value
    default_value: channels

destination:
  plugin: 'entity:taxonomy_term'
  default_bundle: channels

migration_dependencies: {}
