df_secondary.feed_category:
  path: '/category/{slug}/feed'
  defaults:
    _controller: '\Drupal\df_secondary\Controller\FeedController::categoryFeed'
  requirements:
    _access: 'TRUE'
    slug: '[a-z0-9-]+'

df_secondary.feed_node:
  path: '/node/{node}/feed'
  defaults:
    _controller: '\Drupal\df_secondary\Controller\FeedController::nodeFeed'
  requirements:
    _entity_access: 'node.view'
    node: \d+
