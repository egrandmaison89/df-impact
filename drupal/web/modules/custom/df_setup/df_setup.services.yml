services:
  df_setup.article_body_cleaner:
    class: Drupal\df_setup\ArticleBodyCleaner
    arguments:
      - '@entity_type.manager'
      - '@file_url_generator'

  df_setup.digital_exclusive_channels:
    class: Drupal\df_setup\DigitalExclusiveChannels
    arguments: ['@entity_type.manager']

  df_setup.fix_home_front_page:
    class: Drupal\df_setup\EventSubscriber\FixHomeFrontPageConfigSubscriber
    arguments: ['@config.factory', '@entity_type.manager', '@path_alias.manager']
    tags:
      - { name: event_subscriber }

  df_setup.ensure_digital_exclusive_term:
    class: Drupal\df_setup\EventSubscriber\EnsureDigitalExclusiveTermSubscriber
    arguments: ['@df_setup.digital_exclusive_channels']
    tags:
      - { name: event_subscriber }

  df_setup.legacy_topics_path_redirect:
    class: Drupal\df_setup\EventSubscriber\LegacyTopicsPathRedirectSubscriber
    tags:
      - { name: event_subscriber }

  df_setup.topics_index_not_found:
    class: Drupal\df_setup\EventSubscriber\TopicsIndexNotFoundSubscriber
    tags:
      - { name: event_subscriber }

  df_setup.digital_exclusives_legacy_not_found:
    class: Drupal\df_setup\EventSubscriber\DigitalExclusivesLegacyNotFoundSubscriber
    tags:
      - { name: event_subscriber }

  df_setup.legacy_issue_not_found:
    class: Drupal\df_setup\EventSubscriber\LegacyIssueNotFoundSubscriber
    tags:
      - { name: event_subscriber }

  df_setup.wordpress_homepage_route:
    class: Drupal\df_setup\EventSubscriber\WordpressHomepageRouteSubscriber
    tags:
      - { name: event_subscriber }

  df_setup.wordpress_legacy_paths:
    class: Drupal\df_setup\EventSubscriber\WordpressLegacyPathSubscriber
    tags:
      - { name: event_subscriber }

  df_setup.topic_category_archive_paginate:
    class: Drupal\df_setup\EventSubscriber\TopicCategoryArchivePaginateSubscriber
    tags:
      - { name: event_subscriber }

  df_setup.path_processor.topic_archive:
    class: Drupal\df_setup\PathProcessor\TopicTermArchivePathProcessor
    arguments: ['@entity_type.manager']
    tags:
      - { name: path_processor_outbound, priority: 200 }

  df_setup.path_processor.topic_category_archive_inbound:
    class: Drupal\df_setup\PathProcessor\TopicCategoryArchiveInboundPathProcessor
    tags:
      - { name: path_processor_inbound, priority: 250 }
