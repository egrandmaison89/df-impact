    <script type="module">
      import SearchstaxFeedbackWidget from "https://static.searchstax.com/studio-js/v4.1.55/js/feedbackWidget.mjs";
      function makeId(length) {
        let result = "";
        const characters =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        const charactersLength = characters.length;
        for (let i = 0; i < length; i++) {
          result += characters.charAt(
            Math.floor(Math.random() * charactersLength),
          );
        }
        return result;
      }
      const MAX_DESCRIPTION_LENGTH = 5120;

      const config = {
        language: "en",
        searchURL:
          "https://searchcloud-19-us-east-1.searchstax.com/29847/jimmyfunddemo-9082/emselect",
        suggesterURL:
          "https://searchcloud-19-us-east-1.searchstax.com/29847/jimmyfunddemo-9082_suggester/emsuggest",
        searchAuth: "59443d830d5cb68fcbbdd7b59748005fbb7b218c",
        trackApiKey: "DRtQgTLOzs8RmhdqQ9Xhd6AEbTFWl8az5HfqJG2dss4",
        authType: "token",
        relatedSearchesURL:
          "https://app.searchstax.com/api/v1/9082/related-search/",
        relatedSearchesAPIKey: "51481ca12b0ad50a4e8912a4afd8061ef966e368",
        analyticsBaseUrl: "https://analytics-us.searchstax.com",
        questionURL: "https://search-ai-us.searchstax.com/api/v1/9082/answer/",
        geocodingURL: "https://geocoding.searchstax.com",
        countryCode: "us",
        appId: "9082",
        analyticsSrc:
          "https://static.searchstax.com/studio-js/v4.1.55/js/studio-analytics.js",
        sessionId: makeId(25),
      };

      const renderConfig = {
        inputWidget: {},
        facetsWidget: {
          itemsPerPageDesktop: 3,
          itemsPerPageMobile: 99,
          facetingType: "and", // "and" | "or" | "showUnavailable" | "tabs"
        },
        resultsWidget: {
          renderMethod: "pagination", //'infiniteScroll' or 'pagination'
        },
      };

      window.onload = (event) => {
        let searchstaxQuery = "";
        var script = document.createElement("script");
        script.src =
          "https://static.searchstax.com/studio-js/v4.1.55/js/search-ux.js";
        script.onload = function (some) {
          const searchstax = new window[
            "@searchstaxInc/searchstudioUxJs"
          ].Searchstax();

          function searchstaxFeedbackTextAreaOverride() {
            if (!searchstax) {
              return "";
            } else {
              return (
                (searchstax.dataLayer.searchObject.query === "undefined"
                  ? ""
                  : searchstax.dataLayer.searchObject.query) +
                " " +
                searchstax.dataLayer.parsedData.getAnswerData
              );
            }
          }

          searchstax.initialize({
            language: config.language,
            searchURL: config.searchURL,
            suggesterURL: config.suggesterURL,
            searchAuth: config.searchAuth,
            trackApiKey: config.trackApiKey,
            authType: config.authType,
            analyticsBaseUrl: config.analyticsBaseUrl,
            sessionId: config.sessionId,
            questionURL: config.questionURL,
            analyticsSrc: config.analyticsSrc,
            hooks: {
              beforeSearch: (searchObj) => {
                searchstaxQuery = searchObj.query;
                return searchObj;
              },
              afterSearch: (results) => {
                var container = document.querySelector(
                  ".searchstax-view-styles-container",
                );
                if (container) {
                  if (results.length === 0) {
                    container.style.visibility = "hidden";
                  } else {
                    container.style.visibility = "visible";
                  }
                }

                console.log(results);

                // FALLBACK DESCRIPTION LOGIC
                results = results.map((result) => {
                  if (
                    (!result.description || result.description.trim() === "") &&
                    Array.isArray(result.unmappedFields)
                  ) {
                    const descField = result.unmappedFields.find(
                      (field) =>
                        field.key === "description" &&
                        typeof field.value === "string",
                    );
                    if (descField) {
                      result.description = descField.value;
                    }
                  }

                  // delete description from unmappedFields to avoid duplication in the UI
                  if (Array.isArray(result.unmappedFields)) {
                    result.unmappedFields = result.unmappedFields.filter(
                      (field) => field.key !== "description",
                    );
                  }
                  console.log("using description: ", result.description);
                  // if (
                  //   result.description &&
                  //   result.description.length > MAX_DESCRIPTION_LENGTH
                  // ) {
                  //   result.description =
                  //     result.description.substring(0, MAX_DESCRIPTION_LENGTH) +
                  //     "...";
                  // }
                  return result;
                });

                return results;
              },
            },
          });

          searchstax.addSearchLocationWidget("searchstax-location-container", {
            templates: {
              mainTemplate: {
                template: `
        <div class="searchstax-location-input-container" data-test-id="searchstax-location-input-container">
            <div class="searchstax-location-input-wrapper">
                <span class="searchstax-location-input-label">NEAR</span>
               <div class="searchstax-location-input-wrapper-inner">
                  <input type="text" id="searchstax-location-input" class="searchstax-location-input" placeholder="Zip, Postal Code or City..." aria-label="Search Location Input" data-test-id="searchstax-location-input" />
                  <button id="searchstax-location-get-current-location" class="searchstax-get-current-location-button">Use my current location</button>
                </div>
                {{#shouldShowLocationDistanceDropdown}}
                  <span class="searchstax-location-input-label">WITHIN</span>
                  <select id="searchstax-location-radius-select" class="searchstax-location-radius-select" aria-label="Search Location Radius Select" data-test-id="searchstax-location-radius-select">
                    {{#locationSearchDistanceValues}}
                      <option value="{{value}}" {{#isSelected}}selected{{/isSelected}}>{{label}}</option>
                    {{/locationSearchDistanceValues}}
                  </select>
                {{/shouldShowLocationDistanceDropdown}}
            </div>
        </div>
        `,
              },
            },
            hooks: {
              locationDecode: (term) => {
                const app_id = config.appId;
                const countryCode = config.countryCode || "US";

                return new Promise((resolve) => {
                  const geocodingURL = `${config.geocodingURL}/forward?location=${encodeURIComponent(term)}&components=country:us&app_id=9082`;
                  fetch(geocodingURL, {
                    headers: {
                      Authorization: `Token ${config.relatedSearchesAPIKey}`,
                      "Content-Type": "application/json",
                    },
                  })
                    .then((response) => response.json())
                    .then((data) => {
                      if (data.status === "OK" && data.results.length > 0) {
                        const result = data.results[0];
                        const location = {
                          lat: result.geometry.lat,
                          lon: result.geometry.lng,
                          address: result.formatted_address,
                        };
                        resolve(location);
                      } else {
                        resolve({
                          address: undefined,
                          lat: undefined,
                          lon: undefined,
                          error: true,
                        });
                      }
                    })
                    .catch(() => {
                      resolve({
                        address: undefined,
                        lat: undefined,
                        lon: undefined,
                        error: true,
                      });
                    });
                });
              },
              locationDecodeCoordinatesToAddress: (lat, lon) => {
                return new Promise((resolve) => {
                  fetch(
                    `${config.geocodingURL}/reverse?location=${lat},${lon}&components=country:us&app_id=9082`,
                    {
                      method: "GET",
                      headers: {
                        Authorization: `Token ${config.relatedSearchesAPIKey}`,
                      },
                    },
                  )
                    .then((response) => response.json())
                    .then((data) => {
                      if (data.status === "OK" && data.results.length > 0) {
                        const result = data.results[0];
                        resolve({
                          address: result.formatted_address,
                          lat: lat,
                          lon: lon,
                          error: false,
                        });
                      } else {
                        resolve({
                          address: undefined,
                          lat: lat,
                          lon: lon,
                          error: true,
                        });
                      }
                    })
                    .catch(() => {
                      resolve({
                        address: undefined,
                        lat: lat,
                        lon: lon,
                        error: true,
                      });
                    });
                });
              },
            },
            locationSearchEnabled: false,
            locationValuesOverride: {
              locationDistanceEnabled: false,
              filterValues: [],
              filterUnit: "",
              locationFilterDefaultValue: "",
            },
          });

          //         new SearchstaxFeedbackWidget({
          //           analyticsKey: "DRtQgTLOzs8RmhdqQ9Xhd6AEbTFWl8az5HfqJG2dss4",
          //           model: "Main Profile",
          //           containerId: "searchstax-feedback-container",
          //           lightweight: false,
          //           mainTemplateOverride: `
          //   <div class="sf-widget-container">

          const currentViewStyle = localStorage.getItem("viewStyle") || "list";
          console.log("currentViewStyle", currentViewStyle);
          const viewStyleElement = document.getElementById("icon-view-style");
          const toggleElement = document.getElementById("toggle-view-style");
          viewStyleElement.classList.add(`icon-${currentViewStyle}`);
          if (currentViewStyle === "list") {
            toggleElement.setAttribute(
              "aria-label",
              "View Style Change Button. Current view style is: list",

          } else {
            toggleElement.setAttribute(

          const searchResultsContainer = document.getElementById(
            "searchstax-results-container",
          );
          searchResultsContainer.classList.add(
            `searchstax-results-container-${currentViewStyle}`,
          );

          const changeViewStyle = () => {
            const currentViewStyle =
              localStorage.getItem("viewStyle") || "list";
            const newViewStyle = currentViewStyle === "list" ? "grid" : "list";
            localStorage.setItem("viewStyle", newViewStyle);
            searchResultsContainer.classList.add(
              `searchstax-results-container-${newViewStyle}`,
            );
            searchResultsContainer.classList.remove(
              `searchstax-results-container-${currentViewStyle}`,
            );

            viewStyleElement.classList.remove(`icon-${currentViewStyle}`);
            viewStyleElement.classList.add(`icon-${newViewStyle}`);

            const accessibilityElement = document.createElement("span");
            accessibilityElement.setAttribute("id", "searchAccessibility");

            accessibilityElement.innerHTML =
              newViewStyle === "grid"
                ? "View style changed to grid view"
                : "View style changed to list view";

            if (newViewStyle === "list") {
              toggleElement.setAttribute(
                "aria-label",
                "View Style Change Button. Current view style is: list",
              );
            } else {
              toggleElement.setAttribute(
                "aria-label",
                "View Style Change Button. Current view style is: grid",
              );
            }

            const existingContainerElement = document.getElementById(
              "searchAccessibilityContainer",
            );
            if (existingContainerElement) {
              setTimeout(() => {
                existingContainerElement.appendChild(accessibilityElement);
              }, 100);
            }
          };

          toggleElement.addEventListener("keyup", (event) => {
            if (event.code === "Space" || event.code === "Enter") {
              changeViewStyle();
            }
          });

          // on click of #toggle-view-style change the view style
          toggleElement.addEventListener("click", function () {
            changeViewStyle();
          });
        };
